[project]
name = "instax-evo-lab"
version = "0.1.0"
description = "BLE reverse engineering lab for instax mini Evo / Link-like printers"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22.0",
  "pillow>=10.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "construct>=2.10.0"
]

[project.scripts]
instax-lab = "instax_lab.cli:app"
